[project]
name = "roversoftware"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-mdt[pt]>=1.3.0",
    "fastapi>=0.110",
    "pygame>=2.5",
    "pyserial>=3.5",
    "uvicorn[standard]>=0.27",
]

# Pi-only hardware/vision deps (fusion_hat, adafruit-circuitpython-gps,
# adafruit-circuitpython-bno08x, edge_impulse_linux, opencv/picamera2) are
# deliberately NOT listed above — they don't install on a dev laptop and would
# break `uv sync`. See requirements.txt.

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Offline model-conversion toolchain (tools/imx500_convert.py). Kept OUT of
# [project.dependencies] on purpose: torch is a ~100MB build-machine-only
# dependency and nothing on the robot imports it — the Pi loads the finished
# .rpk through picamera2. `uv sync` stays lean; run the converter with
# `uv sync --group convert` first.
#
# edge-mdt[pt] IS in the runtime deps above but only ships the converter
# binaries (imxconv-pt / uni-pytorch); MCT's PyTorch quantization backend needs
# torch itself, which the [pt] extra does not pull in.
convert = [
    # UPPER BOUND IS LOad-BEARING, do not relax it to "latest torch".
    # mct_quantizers emits its MCTQ quantizer nodes from `symbolic()` methods on
    # torch.autograd.Function — a hook only the legacy TorchScript ONNX exporter
    # calls. torch 2.9 flipped torch.onnx.export to dynamo=True by default, and
    # the dynamo exporter does not consult those symbolics, so the export either
    # errors out or silently produces an ONNX file with no quantization nodes in
    # it — which imxconv-pt then rejects. Staying on <2.9 keeps the legacy path.
    "torch>=2.4,<2.9",
    "torchvision<0.23",     # edge-mdt-cl hard-requires it alongside torch
    "tflite>=2.10",       # flatbuffer schema bindings — reads the .lite graph
    "ai-edge-litert>=1.0",  # reference interpreter, for parity checks only
    "pillow>=10.0",         # representative-dataset image loading
    "ultralytics>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The robot package is imported from the repo root (there's no src/ layout and
# nothing is installed), so put the root on sys.path. Without this, `uv run
# pytest` fails on `import robot` even though `python -m pytest` works — the
# latter adds cwd implicitly and the former doesn't.
pythonpath = ["."]
