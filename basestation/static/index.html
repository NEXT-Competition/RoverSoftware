<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>uc-chassis · base station</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>uc-chassis</h1>
        <div id="conn" class="pill">connecting…</div>
      </header>

      <section id="fleet-section">
        <h2>Fleet</h2>
        <ul id="fleet-list"></ul>
      </section>

      <section id="control-section">
        <h2>Selected: <span id="sel-name">—</span></h2>
        <div class="modes">
          <button data-mode="teleop">Teleop</button>
          <button data-mode="color_align">Color align</button>
          <button data-mode="waypoint">Waypoint</button>
        </div>
        <div class="estop-row">
          <button id="estop" class="danger">E-STOP</button>
          <button id="clear-estop">Clear</button>
        </div>

        <h3>Route</h3>
        <div class="route-row">
          <button id="route-toggle">Add waypoints</button>
          <button id="route-send">Send route</button>
          <button id="route-clear">Clear</button>
        </div>
        <p class="hint" id="route-hint">Toggle “Add waypoints”, click the map, then Send.</p>

        <div id="telemetry"></div>
      </section>

      <footer>
        <span id="controller-status">🎮 no controller</span>
      </footer>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
